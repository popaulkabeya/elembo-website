<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Elembo Business Technology</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/img/favicon-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf7; --paper:#ffffff; --ink:#15171c; --ink-soft:#3a3e46; --muted:#74787f;
    --line:#e7e4dc; --accent:#1f74cf; --accent-deep:#1a5cab; --accent-soft:#eaf2fc;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--ink-soft);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:56px 48px;max-width:520px;width:100%;text-align:center;box-shadow:0 24px 60px -28px rgba(21,23,28,.18)}
  .logo{height:44px;margin:0 auto 28px;display:block}
  .code{font-weight:700;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep);background:var(--accent-soft);display:inline-block;padding:6px 14px;border-radius:50px;margin-bottom:18px}
  h1{color:var(--ink);font-size:1.75rem;line-height:1.2;letter-spacing:-.015em;font-weight:600;margin-bottom:12px}
  p{color:var(--muted);font-size:.98rem;margin-bottom:30px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;padding:14px 26px;border-radius:50px;background:var(--ink);color:#fff;text-decoration:none;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 24px 60px -28px rgba(21,23,28,.22)}
  .alt{display:block;margin-top:18px;font-size:.9rem;color:var(--muted)}
  .alt a{color:var(--accent-deep);text-decoration:none;font-weight:500}
  .alt a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/img/elembo-logo.webp" alt="Elembo Business Technology" />
    <span class="code">404 — Page not found</span>
    <h1>This page doesn't exist</h1>
    <p>The link may be outdated or mistyped. Everything we offer lives on our home page — solutions, sectors, recent work and how to reach us.</p>
    <a class="btn" href="/">Back to home</a>
    <span class="alt">Need help? <a href="mailto:sales@elembotech.com">sales@elembotech.com</a></span>
  </main>
</body>
</html>
